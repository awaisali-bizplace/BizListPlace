name: Extract merged project zip

on:
  push:
    branches: [main]
    paths:
      - 'bizlistplace-merged.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract zip and move files to repo root
        run: |
          if [ ! -f bizlistplace-merged.zip ]; then
            echo "bizlistplace-merged.zip not found; nothing to do."
            exit 0
          fi
          unzip -o bizlistplace-merged.zip
          cp -a bizlistplace-merged/. ./
          rm -rf bizlistplace-merged bizlistplace-merged.zip
          ls -la

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Merge PKbizMap logic into BizListPlace UI"
          git push
